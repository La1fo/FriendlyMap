<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css?v=20260311a">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div>
            <h1>Friendly Map</h1>
            <p>Найди удобные места рядом</p>
        </div>
        <div class="toolbar-actions">
            <button id="findMeBtn" class="btn">📍 Я здесь</button>
            <button id="confirmPointBtn" class="btn hidden">✅ Подтвердить точку</button>
        </div>
    </header>

    <section class="toolbar">
        <input id="searchInput" type="search" placeholder="Поиск по названию, адресу, описанию" />
        <div class="toolbar-actions">
            <button id="tagsToggleBtn" class="btn secondary">🏷️ Теги</button>
            <button id="clearFiltersBtn" class="btn secondary">Сброс</button>
            <button id="refreshBtn" class="btn secondary">Обновить</button>
        </div>
        <div id="selectedTags" class="tag-filters hidden"></div>
        <div id="tagFiltersPanel" class="tags-panel hidden">
            <p class="tags-panel-title">Выберите теги:</p>
            <div id="tagFilters" class="tag-filters"></div>
        </div>
    </section>

    <div id="statusBar" class="status hidden"></div>

    <main class="content">
        <div id="map" class="map"></div>
        <aside class="side-panel">
            <section>
                <h3>Результаты</h3>
                <ul id="locationList" class="location-list"></ul>
                <div id="emptyState" class="empty hidden">Нет локаций по текущему фильтру.</div>
            </section>
        </aside>
    </main>

    <section id="detailPanel" class="detail-panel hidden">
        <div class="detail-header">
            <h2 id="detailTitle"></h2>
            <button id="closeDetailBtn" class="btn-icon">✕</button>
        </div>
        <p id="detailAddress" class="detail-address"></p>
        <p id="detailDescription" class="detail-description"></p>
        <div id="detailTags" class="tags"></div>
        <div id="detailPhotos" class="photo-row"></div>
        <div id="routeSummary" class="route-summary hidden"></div>
        <div class="detail-actions">
            <button id="buildRouteBtn" class="btn">🧭 Построить маршрут</button>
            <button id="clearRouteBtn" class="btn secondary">Очистить маршрут</button>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
window.MAP_DEFAULTS = {
  lat: {{ default_lat }},
  lng: {{ default_lng }},
  zoom: {{ default_zoom }}
};
window.MAP_PICKER_MODE = {{ 'true' if picker_mode else 'false' }};
window.MAP_FOCUS_POINT = {{ focus_point|tojson if focus_point else 'null' }};
</script>
<script src="/static/script.js?v=20260311a"></script>
</body>
</html>
