version: "3.9"
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: friendly_map
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - db
    command: python -m bot.main

volumes:
  pgdata:
