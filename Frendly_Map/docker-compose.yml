services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: friendly_map
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  webapp:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - db
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg2://user:password@db:5432/friendly_map}
    ports:
      - "8000:8000"
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - db
      - webapp
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg2://user:password@db:5432/friendly_map}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:8000}
    command: python -m bot.main

volumes:
  pgdata:
